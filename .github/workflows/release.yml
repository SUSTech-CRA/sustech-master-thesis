# FILE GENERATED WITH: npx ghat fregante/ghatemplates/action-release
# SOURCE: https://github.com/fregante/ghatemplates

name: Release

on:
  push:
    branches:
      - "master"
    tags:
      - v*

permissions:
  contents: read

jobs:
  build_latex:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'SUSTech-CRA'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          python-version: '3.12'

      - name: Meta-data normalization
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python test/update-dist.py --dev --sha ${GITHUB_SHA}

      - name: run texlive docker container
        uses: docker://texlive/texlive:latest
        # https://hub.docker.com/r/texlive/texlive
        with:
          args: make dist-github

      - name: Archive Release
        run: zip -r sustech-thesis-dev-build.zip . -x '*.git*' '*/node_modules/*' '.editorconfig' 'sustech-thesis-dev-build.zip'

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'sustech-thesis-dev-build'
          path: 'sustech-thesis-dev-build.zip'

      - name: Upload Pre-release artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'pre-release-artifacts_action_build'
          path: |
            sustechthesis.cls
            sustechthesis.pdf
            public-test/*.pdf

  pre-release:
    name: "Pre Release"
    runs-on: "ubuntu-latest"
    needs: build_latex
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        name: Download artifact

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release delete dev-latest --cleanup-tag --yes
          else
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev-latest" >/dev/null 2>&1 || true
          fi

          gh release create dev-latest \
            pre-release-artifacts_action_build/sustechthesis.cls \
            pre-release-artifacts_action_build/sustechthesis.pdf \
            pre-release-artifacts_action_build/public-test/*.pdf \
            sustech-thesis-dev-build/sustech-thesis-dev-build.zip \
            --target "${GITHUB_SHA}" \
            --title "Dev Build（预发布）" \
            --prerelease \
            --generate-notes

  release-tag:
    name: "Draft release by tag"
    runs-on: "ubuntu-latest"
    needs: build_latex
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        name: Download artifact

      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename artifact
        run: cp sustech-thesis-dev-build/sustech-thesis-dev-build.zip sustech-thesis-dev-build/sustech-thesis-${{ steps.get_version.outputs.version }}.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          assets=(
            pre-release-artifacts_action_build/sustechthesis.cls
            pre-release-artifacts_action_build/sustechthesis.pdf
            pre-release-artifacts_action_build/public-test/*.pdf
            "sustech-thesis-dev-build/sustech-thesis-${VERSION}.zip"
          )

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${assets[@]}" --clobber
            gh release edit "${VERSION}" --draft --title "${VERSION}"
          else
            gh release create "${VERSION}" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "${VERSION}" \
              --generate-notes
